# Deploys the site to Cloudflare Pages on every push to main, the same way
# travsr-web deploys travsr.com: direct upload from Actions with an API token,
# rather than connecting the repo to Cloudflare. Nothing has to be authorised
# in a dashboard for a deploy to run, and the credentials stay repo secrets.
#
# Two secrets are required on this repo:
#   CLOUDFLARE_API_TOKEN    scope: Account > Cloudflare Pages > Edit
#   CLOUDFLARE_ACCOUNT_ID   the account holding the Pages project
#
# The custom domain (pathshala.2bit.in) is attached to the Pages project once,
# in the dashboard. Cloudflare writes the DNS record itself as long as the
# 2bit.in zone sits in the same account, so nothing here touches DNS.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:        # for redeploying without an empty commit

concurrency:
  # a newer push makes an in-flight deploy pointless, but never interrupt one
  # that is already uploading, or Pages is left with a half-written deployment
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: pathshala.2bit.in
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # the repo's own guard rails, and the reason they exist: every check in
      # here fired because something once broke in exactly that way. A deploy
      # that skips them is a deploy that can publish a spilling label or a
      # visual pointing at a variable no stylesheet defines.
      - name: Check
        run: node tools/check.js

      # Only what the site serves. README, docs and tools are part of the repo,
      # not part of the site, and there is no reason to publish them twice.
      # A new top-level directory that the pages load has to be added here.
      - name: Stage the public files
        run: |
          mkdir -p _site
          cp ./*.html _site/
          cp -r assets data _site/
          echo "staged $(find _site -type f | wc -l) files"

      # An invalid or mis-pasted token surfaces from the deploy as
      # "Authentication failed (status: 400) [code: 9106]", which says nothing
      # about which of the several possible causes it was. Ask the API directly
      # first, so the log names the problem instead of describing a symptom.
      - name: Verify the credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [ -n "${CF_TOKEN:-}" ]   || fail "CLOUDFLARE_API_TOKEN is not set on this repository."
          [ -n "${CF_ACCOUNT:-}" ] || fail "CLOUDFLARE_ACCOUNT_ID is not set on this repository."
          # A value pasted with a trailing newline or a stray space makes the
          # Authorization header unparseable, which is exactly the 9106 above.
          case "$CF_TOKEN" in
            *[[:space:]]*) fail "CLOUDFLARE_API_TOKEN contains whitespace. Re-add it with no trailing newline: printf %s 'TOKEN' | gh secret set CLOUDFLARE_API_TOKEN" ;;
          esac
          case "$CF_ACCOUNT" in
            *[[:space:]]*) fail "CLOUDFLARE_ACCOUNT_ID contains whitespace." ;;
          esac

          status=$(curl -sS https://api.cloudflare.com/client/v4/user/tokens/verify \
            -H "Authorization: Bearer $CF_TOKEN" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print((d.get("result") or {}).get("status") or "; ".join(e.get("message","") for e in (d.get("errors") or [])) or "unknown")')
          echo "token verify: $status"
          [ "$status" = "active" ] || fail "The API token did not verify: $status. It is either wrong, revoked, expired, or a Global API Key rather than an API token."

      - name: Install wrangler
        # Pinned. Left to itself the action installs whatever it defaults to,
        # which was 3.90.0 on a runner where 4.x is current, and a version that
        # moves under you is a deploy that can start failing without a commit.
        run: npm install -g wrangler@4

      # wrangler will not create a Pages project as a side effect of deploying
      # to it. On a terminal it offers; in CI it just fails. Nothing had created
      # this one, so the first green token would only have bought the next error.
      - name: Ensure the Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if wrangler pages project list | grep -qE '(^|[[:space:]])kaksha([[:space:]]|$)'; then
            echo "project kaksha already exists"
          else
            echo "creating project kaksha"
            wrangler pages project create kaksha --production-branch=main
          fi

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler pages deploy _site --project-name=kaksha --branch=main
