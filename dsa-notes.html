<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="assets/img/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png" />
  <script>
    /* set the theme before first paint so dark mode never flashes light */
    (function () { try { var s = localStorage.getItem("dsa-theme");
      if (s === "dark" || (!s && matchMedia("(prefers-color-scheme: dark)").matches))
        document.documentElement.setAttribute("data-theme", "dark"); } catch (e) {} })();
  </script>
  <title>DSA Notes: Topic Notes + Practice</title>
  <meta name="description" content="Study one DSA topic at a time: brief pattern notes, short code, and practice questions to test yourself." />
  <link rel="preload" href="assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="assets/css/tokens.css?v=1" />
  <link rel="stylesheet" href="assets/css/fonts.css" />
  <link rel="stylesheet" href="assets/css/brand.css" />
  <link rel="stylesheet" href="assets/css/notes.css?v=1" />
  <script src="assets/js/scroll-focus.js" defer></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css" media="print" onload="this.media='all'" />
  <script defer src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js" onload="document.querySelectorAll('pre code[class*=language-]:not([data-highlighted])').forEach(function (c) { try { hljs.highlightElement(c); } catch (e) {} })"></script>
</head>
<body>
  <header class="bar">
    <div class="bar-in">
      <button class="menu-btn" id="menuBtn" aria-label="Toggle topics">Menu</button>
      <a class="brandlock" href="index.html"><img src="assets/img/logo-64.png" alt="" width="28" height="28" /><span>2BIT <span class="bl-accent">Pathshala</span></span></a>
      <span class="bl-divider" aria-hidden="true"></span>
      <div class="logo">DSA <span>Notes</span></div>
      <div class="sp"></div>
      <a class="btn" href="dsa-patterns.html">Patterns</a>
      <a class="btn" href="dsa-sheet.html">One-day sheet</a>
      <button class="btn" id="themeToggle">Dark</button>
    </div>
  </header>

  <div class="scrim" id="scrim"></div>
  <div class="layout">
    <aside class="side" id="side">
      <input id="noteSearch" class="note-search" type="text" placeholder="Search all notes…" autocomplete="off" />
      <div id="searchResults" class="search-results"></div>
      <div class="side-title">Topics</div>
      <nav id="topicNav"></nav>
    </aside>
    <main id="main"></main>
  </div>

  <footer>Study one topic → read brief notes &amp; short code → solve the questions to test yourself. Progress syncs with the <a href="dsa-patterns.html">patterns roadmap</a> · <a class="brandlock sm" href="index.html"><img src="assets/img/logo-64.png" alt="" width="18" height="18" loading="lazy" /><span>2BIT <span class="bl-accent">Pathshala</span></span></a></footer>

  <script src="data/dsa-data.js"></script>
  <script src="data/dsa-code.js"></script>
  <script src="assets/js/notes.js"></script>
  <script src="assets/js/theme.js"></script>
  <script>
    NOTES.mount({
      data: DSA,
      code: typeof DSA_CODE !== "undefined" ? DSA_CODE : null,
      lang: "python",
      hl: "python",
    });
  </script>
</body>
</html>
